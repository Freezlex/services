# Default-deny ingress for the whole namespace. Legitimate ingress arrives
# either from Traefik (proxy ns) or from other pods in this namespace
# (Synapse <-> MAS <-> Postgres <-> LiveKit).
# Egress is intentionally left open: Synapse federation and MAS SMTP need
# arbitrary internet destinations.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxy
