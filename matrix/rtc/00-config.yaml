apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix
data:
  livekit.yaml: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      tcp_port: 7881
      # Single-port UDP mux. This is what lk-media actually exposes, so no
      # port_range_start/end here: that range was never published by the
      # LoadBalancer and is unused while udp_port is set.
      udp_port: 7882
      node_ip: "${LIVEKIT_NODE_IP}"
      use_external_ip: false
    room:
      auto_create: false
    keys:
      default: "${LIVEKIT_SECRET}"
    logging:
      level: info
