apiVersion: v1
kind: Service
metadata:
  name: lk-jwt
  namespace: matrix
spec:
  type: ClusterIP
  selector:
    app: livekit-jwt
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lk
  namespace: matrix
spec:
  selector:
    app: livekit
  ports:
    - name: http
      port: 7880
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lk-media
  namespace: matrix
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.200
    metallb.io/allow-shared-ip: homelab-vip
spec:
  type: LoadBalancer
  # Single node: the livekit pod is pinned to mako, so Local is safe and
  # preserves client IPs for TURN/ICE.
  externalTrafficPolicy: Local
  selector:
    app: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
