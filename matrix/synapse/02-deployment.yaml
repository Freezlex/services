apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      annotations:
        # Regenerate after editing 01-config.yaml: sha256sum matrix/synapse/01-config.yaml
        checksum/config: "205752ec062a1930"
      labels:
        app: synapse
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: mako
      priorityClassName: homelab-critical
      securityContext:
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: render-config
          image: alpine:3.24
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /tmp/homeserver.yaml > /data/homeserver.yaml
              mkdir -p /data/media_store
              mkdir -p /data/uploads
              mkdir -p /data/cache
              chown -R 991:991 /data
              chown 991:991 /data/homeserver.yaml
              echo "homeserver.yaml rendered."
          envFrom:
            - secretRef:
                name: matrix-creds
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-config
              mountPath: /tmp
              readOnly: true

      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.164.2
          securityContext:
            runAsUser: 991
            runAsGroup: 991
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8008
          envFrom:
            - secretRef:
                name: matrix-creds
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: http
            # 120 x 5s = 10 min: Synapse migrations on a large DB can take
            # longer; killing the pod mid-migration corrupts the upgrade.
            failureThreshold: 120
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: synapse-data
              mountPath: /data
            - name: synapse-signing-key
              mountPath: /keys/polarys.im.signing.key
              subPath: polarys.im.signing.key
              readOnly: true
            - name: synapse-config
              mountPath: /config/polarys.im.log.config
              subPath: log.config

      volumes:
        - name: synapse-data
          persistentVolumeClaim:
            claimName: synapse-pvc
        - name: synapse-signing-key
          secret:
            secretName: matrix-creds
            items:
              - key: MX_SIGNING_KEY
                path: polarys.im.signing.key
        - name: synapse-config
          configMap:
            name: synapse-cfm
