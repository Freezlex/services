# This file is listed in .gitignore and must NEVER be committed.
# Copy it, fill in real values, then apply:
#   cp matrix/01-secrets.template.yaml matrix/01-secrets.yaml
#   kubectl apply -f matrix/01-secrets.yaml
#
# To generate strong secrets:
#   openssl rand -hex 32
# EXCEPT MX_SIGNING_KEY below — that one is NOT a hex string (see comment).
apiVersion: v1
kind: Secret
metadata:
  name: pg-creds
  namespace: matrix
type: Opaque
stringData:
  DB_ROOT_USERNAME: "CHANGE_ME"
  DB_ROOT_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: matrix-creds
  namespace: matrix
type: Opaque
stringData:
  # NOT `openssl rand -hex 32` — a Synapse signing key is an ed25519 key file:
  #   ed25519 <key_id> <base64-private-key>
  # Generate with Synapse itself and paste the whole file:
  #   docker run --rm -v "$PWD:/keys" ghcr.io/element-hq/synapse:v1.164.2 \
  #     python -m synapse.app.homeserver -c /dev/null --generate-keys ...
  # or simply: synapse --generate-keys (writes <server_name>.signing.key).
  # Losing this key breaks federation identity — back it up (it is shipped
  # offsite by global/offsite-backup via the secrets-export job).
  MX_SIGNING_KEY: "CHANGE_ME"
  # Synapse database credentials
  MX_DB_USERNAME: "CHANGE_ME"
  MX_DB_PASSWORD: "CHANGE_ME"
  MX_DB_NAME: "matrix_synapse"
  # Synapse secrets — generate each with: openssl rand -hex 32
  # (no MX_REGISTRATION_SECRET: MAS owns registration and Synapse has
  #  password_config.enabled: false, so the shared secret had no effect.)
  MX_MACAROON_SECRET: "CHANGE_ME"
  MX_FORM_SECRET: "CHANGE_ME"
  # MAS database credentials
  MAS_DB_USERNAME: "CHANGE_ME"
  MAS_DB_PASSWORD: "CHANGE_ME"
  MAS_DB_NAME: "matrix_auth"
  # Shared token between MAS and Synapse — generate with: openssl rand -hex 32
  MX_MAS_EXCHANGE_TOKEN: "CHANGE_ME"
  # OAuth client secret for Headlamp (https://k8s.polarys.im).
  # Lives here rather than in `mas-creds` because the MAS render-config init
  # container envsubst's the config using `envFrom: secretRef: matrix-creds`.
  # Must match OIDC_CLIENT_SECRET in the headlamp namespace's `headlamp-creds`.
  MAS_HEADLAMP_CLIENT_SECRET: "CHANGE_ME"
  # OAuth client secret for Forgejo (https://git.polarys.im).
  # Must match MAS_CLIENT_SECRET in the git namespace's `forgejo-creds`.
  MAS_FORGEJO_CLIENT_SECRET: "CHANGE_ME"
  # OAuth client secret for the Traefik dashboard's oauth2-proxy gate
  # (https://dashboard.polarys.im). Must match OAUTH2_PROXY_CLIENT_SECRET in
  # the proxy namespace's `oauth2-proxy-creds`.
  MAS_OAUTH2PROXY_CLIENT_SECRET: "CHANGE_ME"
  # Email relay for account verification
  MAS_EMAIL_TOKEN: "CHANGE_ME"
  MAS_EMAIL_LOGIN: "CHANGE_ME"
  MAS_EMAIL_HOST: "CHANGE_ME"
---
# MAS secrets split into their own Secret so the MAS pod only mounts
# what it needs (principle of least privilege).
#
# The secrets.yaml block is the raw YAML output of: mas-cli config generate
# Paste only the `secrets:` block from that output here as a single
# multi-line string value. Losing these keys breaks SSO/tokens — back them
# up (shipped offsite by global/offsite-backup via the secrets-export job).
apiVersion: v1
kind: Secret
metadata:
  name: mas-creds
  namespace: matrix
type: Opaque
stringData:
  # Paste the full `secrets:` block from `mas-cli config generate` here.
  # Example structure (replace entirely with real output):
  #
  # secrets.yaml: |
  #   secrets:
  #     encryption: <hex>
  #     keys:
  #       - key: |
  #       - key: |
  #       - key: |
  #       - key: |
  #         ...
  secrets.yaml: |
    secrets:
      encryption: "CHANGE_ME"
      keys: []
---
apiVersion: v1
kind: Secret
metadata:
  name: rtc-creds
  namespace: matrix
type: Opaque
stringData:
  LIVEKIT_KEY: "default"
  LIVEKIT_SECRET: "CHANGE_ME"
  LIVEKIT_NODE_IP: "CHANGE_ME"
