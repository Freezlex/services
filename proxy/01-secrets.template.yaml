apiVersion: v1
kind: Secret
metadata:
  name: traefik-dns-creds
  namespace: proxy
type: Opaque
stringData:
  ROOT_EMAIL: "CHANGE_ME"
  # Required.
  SCW_SECRET_KEY: "CHANGE_ME"
  # Optional — set if the key is scoped to a specific project/organisation.
  SCW_PROJECT_ID: "CHANGE_ME"
  SCW_ACCESS_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth
  namespace: proxy
type: Opaque
stringData:
  users: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
  namespace: proxy
type: Opaque
stringData:
  # Must hold the SAME value as MAS_OAUTH2PROXY_CLIENT_SECRET in the matrix
  # secrets (secret `matrix-creds`) — the two halves of one OAuth client.
  OAUTH2_PROXY_CLIENT_SECRET: "CHANGE_ME"

  # Must be raw 16, 24, or 32 bytes, base64-encoded. Generate with:
  #   python3 -c "import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
  OAUTH2_PROXY_COOKIE_SECRET: "CHANGE_ME"
  allowed-subs: |
    CHANGE_ME_TO_YOUR_SUB_ULID
