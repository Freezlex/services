# Credentials for the ACME DNS-01 challenge.
#
# The polarys.im zone is hosted at Scaleway (ns0/ns1.dom.scw.cloud) since
# 2026-08-27, so lego uses the `scaleway` provider. Only SCW_SECRET_KEY is
# required; the others are optional and can be dropped if unused.
#
# Create the key in the Scaleway console under
#   IAM > API keys  (the identity needs DNS zone write on polarys.im)
#
# NOTE: this Secret was previously named `traefik-cf-creds` and held OVH_*
# variables — a leftover from two migrations ago. Delete the old one after
# applying this file:
#   kubectl delete secret traefik-cf-creds -n proxy
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dns-creds
  namespace: proxy
type: Opaque
stringData:
  ROOT_EMAIL: "CHANGE_ME"
  # Required.
  SCW_SECRET_KEY: "CHANGE_ME"
  # Optional — set if the key is scoped to a specific project/organisation.
  SCW_PROJECT_ID: "CHANGE_ME"
  SCW_ACCESS_KEY: "CHANGE_ME"
---
# Generate the password string with:
#   openssl passwd -6 'somepassword'
#   final should look like user:$opensslresult
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth
  namespace: proxy
type: Opaque
stringData:
  users: "CHANGE_ME"
