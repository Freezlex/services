apiVersion: v1
kind: Secret
metadata:
  name: traefik-dns-creds
  namespace: proxy
type: Opaque
stringData:
  ROOT_EMAIL: "CHANGE_ME"
  # Required.
  SCW_SECRET_KEY: "CHANGE_ME"
  # Optional — set if the key is scoped to a specific project/organisation.
  SCW_PROJECT_ID: "CHANGE_ME"
  SCW_ACCESS_KEY: "CHANGE_ME"
---
# Generate the password string with:
#   openssl passwd -6 'somepassword'
#   final should look like user:$opensslresult
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth
  namespace: proxy
type: Opaque
stringData:
  users: "CHANGE_ME"
