apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: proxy
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.200
    metallb.io/allow-shared-ip: homelab-vip
spec:
  type: LoadBalancer
  # Single node: Traefik is pinned to mako (the node that advertises the
  # MetalLB IP), so Local is safe and preserves real client IPs in
  # X-Forwarded-For for Forgejo/MAS rate limiting and audit logs.
  externalTrafficPolicy: Local
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
    - name: websecure
      port: 443
      targetPort: websecure
    - name: factorio
      port: 34197
      targetPort: 34197
      protocol: UDP
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: proxy
  labels:
    app: dashboard
spec:
  selector:
    app: traefik
  ports:
    - name: dashboard
      port: 8080
      targetPort: dashboard
