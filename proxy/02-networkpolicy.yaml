# Default-deny ingress in the proxy namespace, then re-open only what the
# LoadBalancer service exposes externally (Traefik entrypoints) plus
# same-namespace traffic (Traefik -> oauth2-proxy forward-auth, dashboard).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: proxy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22
        - protocol: UDP
          port: 34197
