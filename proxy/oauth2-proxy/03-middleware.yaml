apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-auth
  namespace: proxy
spec:
  forwardAuth:
    # No trailing /auth — pointing at the bare /oauth2/ prefix lets
    # oauth2-proxy itself decide whether to answer the auth check or emit a
    # sign-in redirect, avoiding a bare unstyled 401 on expired sessions.
    address: http://oauth2-proxy.proxy.svc.cluster.local:4180/oauth2/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
