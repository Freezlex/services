apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url=https://auth.polarys.im/
            - --redirect-url=https://dashboard.polarys.im/oauth2/callback
            - --scope=openid
            # MAS never puts email/username in its tokens (see
            # proxy/oauth2-proxy/00-secrets.template.yaml comment) — sub is
            # the only usable claim, so it's remapped to fill the "email"
            # slot oauth2-proxy's authorization logic runs on.
            - --oidc-email-claim=sub
            - --authenticated-emails-file=/etc/oauth2-proxy/allowed-subs
            - --cookie-secure=true
            - --cookie-domains=.polarys.im
            - --whitelist-domain=.polarys.im
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --set-xauthrequest=true
            # Forward-auth mode only — Traefik never routes real traffic to
            # this upstream, it just asks "is this request authorized?".
            - --upstream=static://200
          envFrom:
            - secretRef:
                name: oauth2-proxy-creds
          ports:
            - name: http
              containerPort: 4180
          volumeMounts:
            - name: allowed-subs
              mountPath: /etc/oauth2-proxy
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: allowed-subs
          secret:
            secretName: oauth2-proxy-creds
            items:
              - key: allowed-subs
                path: allowed-subs
