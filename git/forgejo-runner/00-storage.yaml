apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo-runner-pv
  labels:
    app: forgejo-runner
  namespace: git
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  claimRef:
    name: forgejo-runner-pvc
    namespace: git
  hostPath:
    path: /data/k8s/forgejo-runner
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-pvc
  namespace: git
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: local-storage
  volumeName: forgejo-runner-pv
