apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: git
spec:
  replicas: 1
  # ReadWriteOnce hostPath PVC — never run two runner pods over one /data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: mako
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: alpine:3.21
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /tmp/template/config.yaml.template > /tmp/rendered/config.yaml
              echo "config.yaml rendered to /etc/runner/config.yaml"
          envFrom:
            - secretRef:
                name: forgejo-runner-creds
          volumeMounts:
            - name: runner-raw-config
              mountPath: /tmp/template
              readOnly: true
            - name: runner-rendered-config
              mountPath: /tmp/rendered

      containers:
        - name: runner
          # pin to the latest release from codeberg.org/forgejo/runner/releases
          image: codeberg.org/forgejo/runner:12.0.0
          command:
            - forgejo-runner
            - daemon
            - --config
            - /etc/runner/config.yaml
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-rendered-config
              mountPath: /etc/runner/config.yaml
              subPath: config.yaml
              readOnly: true

        - name: dind
          image: docker:28-dind
          env:
            # plain TCP on 2375, loopback only — the runner reaches it via DOCKER_HOST
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - name: docker
              containerPort: 2375
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          securityContext:
            privileged: true
          volumeMounts:
            - name: runner-data
              mountPath: /var/lib/docker
              subPath: dind

      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-pvc
        - name: runner-raw-config
          configMap:
            name: forgejo-runner-config
        - name: runner-rendered-config
          emptyDir: {}
