apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: mako
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: alpine:3.21
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /tmp/template/runner-config.yml.template > /data/runner-config.yml
              chown 1000:1000 /data/runner-config.yml
              mkdir -p /data/.cache
              chmod 775 /data/.cache
              chmod g+s /data/.cache
              echo "runner-config.yml rendered to /data/runner-config.yml"
          envFrom:
            - secretRef:
                name: forgejo-runner-creds
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-raw-config
              mountPath: /tmp/template
              readOnly: true
        - name: wait-for-dind
          image: alpine:3.21
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          command:
            - sh
            - -c
            - |
              until nc -z 127.0.0.1 2375; do
                echo "waiting for dind on 127.0.0.1:2375..."
                sleep 2
              done
              echo "dind is up"

      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          command:
            - forgejo-runner
            - daemon
            - --config
            - /data/runner-config.yml
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runner-data
              mountPath: /data

        - name: dind
          image: docker:28-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - dockerd
            - -H
            - tcp://0.0.0.0:2375
            - --tls=false
          ports:
            - name: docker
              containerPort: 2375
          readinessProbe:
            tcpSocket:
              port: docker
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          securityContext:
            privileged: true
          volumeMounts:
            - name: runner-data
              mountPath: /var/lib/docker
              subPath: dind

      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-pvc
        - name: runner-raw-config
          configMap:
            name: forgejo-runner-config
