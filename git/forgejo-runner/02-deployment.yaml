apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: git
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      nodeSelector:
        kubernetes.io/hostname: mako
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: render-config
          image: alpine:3.21
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache gettext
              envsubst < /tmp/template/runner-config.yml.template > /data/runner-config.yml
              chown 1000:1000 /data/runner-config.yml
              mkdir -p /data/.cache
              chown 1000:1000 /data/.cache
              chmod 775 /data/.cache
              chmod g+s /data/.cache
              echo "runner-config.yml rendered to /data/runner-config.yml"
          envFrom:
            - secretRef:
                name: forgejo-runner-creds
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-raw-config
              mountPath: /tmp/template
              readOnly: true

        - name: dind
          image: docker:28-dind
          restartPolicy: Always
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            - dockerd
            # 0.0.0.0 so job containers (created inside dind, own netns) can
            # reach the daemon via the pod IP; pod-local only — the runner
            # pod's NetworkPolicy blocks anything leaving the cluster
            - -H
            - tcp://0.0.0.0:2375
            - -H
            - unix:///var/run/docker.sock
            - --tls=false
          startupProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["docker", "-H", "tcp://127.0.0.1:2375", "info"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          securityContext:
            privileged: true
          volumeMounts:
            - name: runner-data
              mountPath: /var/lib/docker
              subPath: dind

      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13
          command:
            - forgejo-runner
            - daemon
            - --config
            - /data/runner-config.yml
          workingDir: /data
          env:
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: runner-data
              mountPath: /data

      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-pvc
        - name: runner-raw-config
          configMap:
            name: forgejo-runner-config
