apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: git
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: .runner
      capacity: 2
      timeout: 1h
      labels:
        # jobs with `runs-on: docker` get this image when no `container:` is set
        - "docker:docker://docker:28"
    container:
      network: bridge
      # the runner talks to the dind sidecar over TCP, so it does NOT need to be privileged
      privileged: false
      valid_volumes: []
    cache:
      enabled: true
  .env.template: |
    FORGEJO_INSTANCE_URL=https://git.polarys.im
    REGISTRATION_TOKEN=${REGISTRATION_TOKEN}
