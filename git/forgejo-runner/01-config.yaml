apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: git
data:
  runner-config.yml.template: |
    log:
      level: info
    runner:
      capacity: 1
      timeout: 1h
      labels:
        - "docker:docker://docker:28"
      envs:
        # injected into every job container; ${POD_IP} is substituted by the
        # init container — job containers run inside dind and reach the sidecar
        # through the pod IP (containers in a pod share its network namespace)
        DOCKER_HOST: tcp://${POD_IP}:2375
    container:
      docker_host: tcp://127.0.0.1:2375
      network: ""
      options: "--memory=2g --cpus=2"
      privileged: false
      valid_volumes: []
    cache:
      enabled: true
    server:
      connections:
        forgejo:
          url: https://git.polarys.im/
          uuid: ${RUNNER_UUID}
          token: ${RUNNER_TOKEN}
