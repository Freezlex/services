apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: git
data:
  # Rendered by the init container with envsubst so the one-time runner
  # token never lives in a ConfigMap — only in the forgejo-runner-creds secret.
  config.yaml.template: |
    log:
      level: info
    runner:
      capacity: 2
      timeout: 1h
      labels:
        # jobs with `runs-on: docker` get this image when no `container:` is set
        - "docker:docker://docker:28"
    container:
      network: bridge
      # the runner talks to the dind sidecar over TCP, so it does NOT need to be privileged
      privileged: false
      valid_volumes: []
    cache:
      enabled: true
    server:
      connections:
        forgejo:
          url: https://git.polarys.im/
          uuid: ${RUNNER_UUID}
          token: ${RUNNER_TOKEN}
