apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-pg
  namespace: git
spec:
  serviceName: forgejo-pg-svc
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-pg
  template:
    metadata:
      labels:
        app: forgejo-pg
    spec:
      securityContext:
        fsGroup: 999
      # Give Postgres time to finish a clean shutdown before SIGKILL.
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: render-init-sql
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              envsubst < /tmp/template/init.sql > /tmp/rendered/init.sql
              echo "init.sql rendered successfully"
          envFrom:
            - secretRef:
                name: forgejo-creds
          volumeMounts:
            - name: postgres-raw-config
              mountPath: /tmp/template
              readOnly: true
            - name: postgres-rendered-config
              mountPath: /tmp/rendered
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false

      containers:
        - name: postgres
          image: postgres:18.3
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pg-creds
                  key: DB_ROOT_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-creds
                  key: DB_ROOT_PASSWORD
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - pg_ctl -D "$PGDATA" -w -t 60 -m fast stop
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # NOTE: mountPath + subPath are deliberately left exactly as they
            # were, and PGDATA is deliberately NOT set here even though the
            # matrix Postgres sets it. Changing either on a cluster that
            # already has data would point Postgres at an empty directory and
            # silently initdb a blank database over a working Forgejo.
            - name: forgejo-pg-data
              mountPath: /var/lib/postgresql
              subPath: pgdata
            # This mount was missing entirely: the init container rendered
            # init.sql into an emptyDir that nothing ever read, so the Forgejo
            # database, user and schema were never created from it.
            # Entrypoint scripts run only when the data directory is empty, so
            # adding this is a no-op for the existing database and fixes
            # provisioning from scratch.
            - name: postgres-rendered-config
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: forgejo-pg-data
          persistentVolumeClaim:
            claimName: forgejo-pg-pvc
        - name: postgres-raw-config
          configMap:
            name: pg-cfm
        - name: postgres-rendered-config
          emptyDir: {}
