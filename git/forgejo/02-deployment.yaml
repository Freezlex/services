apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: git
spec:
  replicas: 1
  # ReadWriteOnce hostPath PVC — never run two Forgejo pods over one /data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      nodeSelector:
        kubernetes.io/hostname: mako
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: alpine:3.21
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              mkdir -p /data/gitea/conf
              envsubst < /tmp/app.ini > /data/gitea/conf/app.ini
              chown -R 1000:1000 /data
              echo "app.ini rendered to /data/gitea/conf/app.ini"
          envFrom:
            - secretRef:
                name: forgejo-creds
          volumeMounts:
            - name: forgejo-data
              mountPath: /data
            - name: forgejo-config
              mountPath: /tmp/app.ini
              subPath: app.ini
              readOnly: true

        - name: register-mas-sso
          image: codeberg.org/forgejo/forgejo:16.0.3
          env:
            - name: GITEA_CUSTOM
              value: /data/gitea
            - name: MAS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-creds
                  key: MAS_CLIENT_SECRET
          command:
            - /bin/sh
            - -c
            - |
              set -u

              NAME="mas"
              CLIENT_ID="01M1E9G4JQQ8MMJGT9ZEC33KJ9"
              DISCOVERY="https://auth.polarys.im/.well-known/openid-configuration"
              SCOPES="openid email"

              if forgejo admin auth list 2>/dev/null | awk '{print $2}' | grep -qx "$NAME"; then
                echo "Auth source '$NAME' already exists — nothing to do."
                exit 0
              fi

              echo "Registering MAS as OAuth2 source '$NAME'..."
              if forgejo admin auth add-oauth \
                --name "$NAME" \
                --provider openidConnect \
                --key "$CLIENT_ID" \
                --secret "$MAS_CLIENT_SECRET" \
                --auto-discover-url "$DISCOVERY" \
                --scopes "$SCOPES"; then
                echo "Done."
              else
                echo "WARNING: failed to register MAS auth source — will retry on next pod start."
              fi
              exit 0
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: forgejo-data
              mountPath: /data

      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.3
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          envFrom:
            - secretRef:
                name: forgejo-creds
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: forgejo-data
              mountPath: /data

      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-pvc
        - name: forgejo-config
          configMap:
            name: forgejo-config
