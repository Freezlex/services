apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-sso-mas
  namespace: git
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: forgejo-sso
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              mkdir -p /custom/conf
              envsubst < /tmp/app.ini > /custom/conf/app.ini
              echo "app.ini rendered for CLI use."
          envFrom:
            - secretRef:
                name: forgejo-creds
          volumeMounts:
            - name: forgejo-config
              mountPath: /tmp/app.ini
              subPath: app.ini
              readOnly: true
            - name: cli-custom
              mountPath: /custom
          securityContext:
            allowPrivilegeEscalation: false

      containers:
        - name: add-oauth
          image: codeberg.org/forgejo/forgejo:11
          env:
            - name: GITEA_CUSTOM
              value: /custom
            - name: MAS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-creds
                  key: MAS_CLIENT_SECRET
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAME="mas"
              CLIENT_ID="01M1E9G4JQQ8MMJGT9ZEC33KJ9"
              DISCOVERY="https://auth.polarys.im/.well-known/openid-configuration"
              SCOPES="openid email"

              if forgejo admin auth list | awk '{print $2}' | grep -qx "$NAME"; then
                echo "Auth source '$NAME' already exists — nothing to do."
                forgejo admin auth list
                exit 0
              fi

              echo "Registering MAS as OAuth2 source '$NAME'..."
              forgejo admin auth add-oauth \
                --name "$NAME" \
                --provider openidConnect \
                --key "$CLIENT_ID" \
                --secret "$MAS_CLIENT_SECRET" \
                --auto-discover-url "$DISCOVERY" \
                --scopes "$SCOPES"

              echo "Done. Current auth sources:"
              forgejo admin auth list
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: cli-custom
              mountPath: /custom
            - name: forgejo-data
              mountPath: /data

      volumes:
        - name: forgejo-config
          configMap:
            name: forgejo-config
        - name: cli-custom
          emptyDir: {}
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-pvc
