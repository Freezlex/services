# Registers MAS as an OAuth2 login source in Forgejo.
#
# Forgejo has no app.ini syntax for authentication sources — they live in the
# database — so this is the one part of the stack that cannot be expressed
# declaratively. The Job makes it reproducible instead: it is idempotent and
# safe to re-run, so `kubectl apply` after a rebuild restores SSO.
#
# It renders the SAME app.ini as the Deployment (same ConfigMap, same Secret)
# into a private emptyDir and points GITEA_CUSTOM at it. That gives the CLI the
# real database credentials and SECRET_KEY — which Forgejo uses to encrypt the
# stored client secret — without touching the server's own config file.
#
# Re-running after changing the client secret: delete the source first, or use
#   kubectl exec -n git deploy/forgejo -- forgejo admin auth update-oauth --id <id> --secret <new>
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-sso-mas
  namespace: git
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: forgejo-sso
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
      # The discovery URL below must be the public https://auth.polarys.im/ —
      # MAS declares that as its issuer, and the OIDC client rejects a discovery
      # document whose issuer does not match the URL it was fetched from, so
      # the in-cluster http://mas/ cannot be substituted.
      #
      # Reaching it from a pod goes out to the router and back. That is already
      # how lk-jwt-service validates OpenID tokens against the homeserver, so
      # the path is known good on this network and needs no hostAliases
      # override to the MetalLB VIP.
      initContainers:
        - name: render-config
          image: alpine:3.21
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext
              mkdir -p /custom/conf
              envsubst < /tmp/app.ini > /custom/conf/app.ini
              echo "app.ini rendered for CLI use."
          envFrom:
            - secretRef:
                name: forgejo-creds
          volumeMounts:
            - name: forgejo-config
              mountPath: /tmp/app.ini
              subPath: app.ini
              readOnly: true
            - name: cli-custom
              mountPath: /custom
          securityContext:
            allowPrivilegeEscalation: false

      containers:
        - name: add-oauth
          image: codeberg.org/forgejo/forgejo:11
          env:
            # Point the CLI at the private rendered config rather than the
            # server's /data/gitea, so the two never contend for app.ini.
            - name: GITEA_CUSTOM
              value: /custom
            - name: MAS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: forgejo-creds
                  key: MAS_CLIENT_SECRET
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              NAME="mas"
              CLIENT_ID="01M1E9G4JQQ8MMJGT9ZEC33KJ9"
              DISCOVERY="https://auth.polarys.im/.well-known/openid-configuration"

              # MAS advertises scopes_supported: ["openid","email"] and does NOT
              # support "profile". Requesting profile here fails with
              # invalid_scope, which is the usual reason copied-from-Keycloak
              # guides do not work against MAS.
              SCOPES="openid email"

              if forgejo admin auth list | awk '{print $2}' | grep -qx "$NAME"; then
                echo "Auth source '$NAME' already exists — nothing to do."
                forgejo admin auth list
                exit 0
              fi

              echo "Registering MAS as OAuth2 source '$NAME'..."
              forgejo admin auth add-oauth \
                --name "$NAME" \
                --provider openidConnect \
                --key "$CLIENT_ID" \
                --secret "$MAS_CLIENT_SECRET" \
                --auto-discover-url "$DISCOVERY" \
                --scopes "$SCOPES"

              echo "Done. Current auth sources:"
              forgejo admin auth list
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: cli-custom
              mountPath: /custom
            # APP_DATA_PATH in app.ini is /data; mounted so the CLI resolves
            # paths the same way the server does. The command only writes to
            # the database, so sharing this with the running pod is safe.
            - name: forgejo-data
              mountPath: /data

      volumes:
        - name: forgejo-config
          configMap:
            name: forgejo-config
        - name: cli-custom
          emptyDir: {}
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-pvc
