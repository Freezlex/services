# This file is listed in .gitignore and must NEVER be committed.
# Copy it, fill in real values, then apply:
#   cp global/offsite-backup/01-secrets.template.yaml global/offsite-backup/01-secrets.yaml
#   kubectl apply -f global/offsite-backup/01-secrets.yaml
#
# See global/offsite-backup/README.md for how to obtain the pCloud token.
apiVersion: v1
kind: Secret
metadata:
  name: pcloud-rclone-config
  namespace: backups
type: Opaque
stringData:
  rclone.conf: |
    [pcloud]
    type = pcloud
    # Obtain with: docker run --rm -it -v ~/.config/rclone:/config/rclone rclone/rclone authorize "pcloud"
    # then paste the whole token JSON below.
    token = {"access_token":"CHANGE_ME","token_type":"bearer","expiry":"0001-01-01T00:00:00Z"}

    # Everything is encrypted client-side before it leaves the node.
    # Generate both passwords with: openssl rand -base64 32
    [pcloud-crypt]
    type = crypt
    remote = pcloud:polarys-k8s-backups
    password = CHANGE_ME
    password2 = CHANGE_ME
    filename_encryption = standard
    directory_name_encryption = true
