# This file is listed in .gitignore and must NEVER be committed.
# Copy it, fill in real values, then apply:
#   cp k8s/01-secrets.template.yaml k8s/01-secrets.yaml
#   kubectl apply -f k8s/01-secrets.yaml
#
# Keep the .yaml extension — .gitignore matches `*secrets.yaml`, so a file
# named .yml would NOT be ignored and would leak on the next commit.
#
# To generate a strong client secret:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-creds
  namespace: headlamp
type: Opaque
stringData:
  # Must hold the SAME value as MAS_HEADLAMP_CLIENT_SECRET in the matrix
  # secrets (secret `matrix-creds`). Headlamp and MAS live in different
  # namespaces, so the shared client secret is written in both places —
  # they are the two halves of one OAuth client.
  OIDC_CLIENT_SECRET: "CHANGE_ME"
---
# Authorization for real humans, keyed on the identity the kube-apiserver
# derives from the MAS id_token.
#
# This binding lives in the secrets file rather than in headlamp/00-rbac.yaml
# because its subject is your personal MAS account address. Kubernetes RBAC has
# no way to source a subject name from a Secret, so keeping the whole binding in
# the gitignored file is what keeps the address out of the repo.
#
# MAS (as of at least 1.18.0, confirmed against the element-hq/matrix-authentication-service
# `main` branch source) does NOT put `email` or `username` in the id_token, and its
# userinfo endpoint only ever returns {sub, username} — regardless of requested scope
# or account verification state. `generate_id_token()` in
# crates/handlers/src/oauth2/mod.rs only emits iss/sub/aud/iat/exp/nonce/auth_time/
# at_hash/c_hash. Since kube-apiserver's OIDC authenticator only ever reads the
# id_token (it never calls userinfo), `sub` — an opaque per-account ULID — is the
# only usable identity claim MAS can offer it.
#
# k3s is configured with --oidc-username-claim=sub and --oidc-username-prefix=oidc:
# (see /etc/rancher/k3s/config.yaml on the node, not in this repo), so `name` below
# must be `oidc:` followed by the account's raw `sub` value, e.g. `oidc:01ABC...`.
# Get your own sub by decoding an id_token you've obtained for this client (see
# memory/notes on the manual MAS token-extraction procedure) — MAS exposes no
# friendlier lookup for it.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: headlamp-oidc-admin
subjects:
  - kind: User
    name: "CHANGE_ME"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
