# This file is listed in .gitignore and must NEVER be committed.
# Copy it, fill in real values, then apply:
#   cp k8s/01-secrets.template.yaml k8s/01-secrets.yaml
#   kubectl apply -f k8s/01-secrets.yaml
#
# Keep the .yaml extension — .gitignore matches `*secrets.yaml`, so a file
# named .yml would NOT be ignored and would leak on the next commit.
#
# To generate a strong client secret:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-creds
  namespace: headlamp
type: Opaque
stringData:
  # Must hold the SAME value as MAS_HEADLAMP_CLIENT_SECRET in the matrix
  # secrets (secret `matrix-creds`). Headlamp and MAS live in different
  # namespaces, so the shared client secret is written in both places —
  # they are the two halves of one OAuth client.
  OIDC_CLIENT_SECRET: "CHANGE_ME"
---
# Authorization for real humans, keyed on the identity the kube-apiserver
# derives from the MAS id_token.
#
# This binding lives in the secrets file rather than in headlamp/00-rbac.yaml
# because its subject is your personal MAS account address. Kubernetes RBAC has
# no way to source a subject name from a Secret, so keeping the whole binding in
# the gitignored file is what keeps the address out of the repo.
#
# The MAS discovery document at
#   https://auth.polarys.im/.well-known/openid-configuration
# advertises scopes ["openid","email"] and does NOT expose `preferred_username`,
# so `email` is the only human-readable claim available as a username.
#
# With --oidc-username-claim=email the API server uses the raw address as the
# username (Kubernetes only auto-prefixes with the issuer URL when the claim is
# something other than `email`), so `name` below is just the address itself.
# If you fall back to --oidc-username-claim=sub, this becomes the prefixed ULID
# instead, e.g. `oidc:01ABC...`.
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: headlamp-oidc-admin
subjects:
  - kind: User
    name: "CHANGE_ME"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
